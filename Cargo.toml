[workspace]
members = [
    "src/audio_core",
    "src/common",
    "src/core",
    "src/core/crypto",
    "src/rdynarmic",
    "src/shader_recompiler",
    "src/video_core",
    "src/hid_core",
    "src/input_common",
    "src/network",
    "src/web_service",
    "src/frontend_common",
    "src/dedicated_room",
    "src/ruzu_cmd",
    "src/ruzu",
    "tools/capture_harness",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"

[workspace.dependencies]
# Internal crates
common = { path = "src/common" }
shader_recompiler = { path = "src/shader_recompiler" }
video_core = { path = "src/video_core" }
input_common = { path = "src/input_common" }
network = { path = "src/network" }
web_service = { path = "src/web_service" }
frontend_common = { path = "src/frontend_common" }

# JIT recompiler maintained directly in this repository. Its x64 backend
# references the rxbyak submodule under `externals/`.
rdynarmic = { path = "src/rdynarmic" }

# CLI / Config
clap = { version = "4", features = ["derive"] }

# Window / Graphics
# Eden uses SDL3 for input, audio, and its SDL frontend. Build the same SDL
# generation from source so all three Rust crates share one SDL runtime even on
# hosts without a system SDL3 development package.
sdl3 = { version = "=0.18.4", default-features = false, features = ["build-from-source-static", "raw-window-handle"] }
sdl3-sys = { version = "=0.6.8", default-features = false, features = ["build-from-source-static"] }
ash = "0.37"
vk-mem = "0.3"
vulkano = "0.34"
raw-window-handle = "0.6"
libc = "0.2"

# Crypto
aes = "0.8"
ctr = "0.9"
cipher = "0.4"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
md-5 = "0.10"

# Compression
lz4_flex = "0.11"

# OpenGL
gl = "0.14"

# SPIR-V
rspirv = "0.12"
spirv = "0.3"

# Native macOS renderer. These bindings call Metal and QuartzCore directly;
# SPIRV-Cross translates the existing backend-neutral shader IR output to MSL.
objc2 = "0.6"
objc2-metal = "0.3.2"
objc2-quartz-core = "0.3.2"
objc2-foundation = "0.3.2"
spirv-cross2 = { version = "0.7.1", default-features = false, features = ["msl"] }

# Core
log = "0.4"
env_logger = "0.11"
thiserror = "2"
anyhow = "1"
bitflags = "2"
bytemuck = { version = "1", features = ["derive"] }
memmap2 = "0.9"
cubeb = "0.34"
cubeb-sys = "0.34"
parking_lot = "0.12"
fastrand = "2"
serde_json = "1"
toml = "0.8"
tempfile = "3"
openssl = "0.10"
context = "3.0"
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[profile.release]
debug = 1
codegen-units = 1

# Opt-in abort-on-panic profile for benchmarking. The ordinary release profile
# already uses one code-generation unit; this profile adds only `panic =
# "abort"`. LTO remains disabled — see note below.
#
# Build with:
#   cargo build --profile release-lto --bin ruzu
#
# Caveats:
# - `panic = "abort"` skips unwinding. Any `catch_unwind` / `thread::join`
#   paths that today recover from a worker panic will instead see the whole
#   process abort. In particular, the OpenGL and Vulkan shader-cache
#   `catch_shader_exception` boundaries cannot reject a bad cached pipeline
#   under this profile; a typed shader panic aborts the process instead.
#   Re-check audio_core / GPU workers and shader-cache environment readers
#   before shipping binaries built with this profile.
# - LTO disabled: both `lto = "fat"` and `lto = "thin"` fail at the final
#   ruzu-cmd link with `failed to get bitcode from object file for LTO
#   (Can't find section .llvmbc)`. One of ruzu's C-linked transitive deps
#   (openssl-sys / ring / cubeb-sys / gl bindings via cc-rs?) ships a
#   static `.a` archive without embedded LLVM bitcode, which trips the LTO
#   linker. Fixing this would require identifying the offending crate and
#   either (a) adding `[profile.release-lto.package."NAME"] codegen-units
#   = 1` overrides to recompile its Rust glue, or (b) patching its
#   build.rs to pass `-fembed-bitcode` to its cc invocation. Until then,
#   ship without LTO — the CGU=1 + panic=abort pair still cuts unwind
#   tables and gives LLVM whole-crate visibility for the Rust portions.
[profile.release-lto]
inherits = "release"
codegen-units = 1
panic = "abort"
