[package]
name = "ruzu_cmd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints.rust]
# `objc` 0.2 expands this legacy feature probe in downstream crates.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[features]
debug-logs = ["ruzu_core/debug-logs"]

[[bin]]
name = "ruzu-cmd"
path = "src/main.rs"

[dependencies]
common = { workspace = true }
ruzu_core = { package = "core", path = "../core" }
audio_core = { path = "../audio_core" }
hid_core = { path = "../hid_core" }
video_core = { workspace = true }
input_common = { workspace = true }
frontend_common = { workspace = true }
network = { workspace = true }
parking_lot.workspace = true
gl = { workspace = true }
ash = { workspace = true }
raw-window-handle = { workspace = true }
clap = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
rdynarmic = { workspace = true }
libc = { workspace = true }
regex = "1"
sdl3.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
